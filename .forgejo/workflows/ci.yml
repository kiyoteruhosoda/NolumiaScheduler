# Build (Core) -> test (CoreTests). Runs on PRs and on pushes to main.
#
# The UI shell (Presentation, WinUI, NolumiaSchedulerTest) targets Windows, so it is left out.
# Logic lives in Core and is guarded by CoreTests (docs/decisions/ADR-0001).
#
# ⚠ Runs on the runner's default job image (node:24-bookworm). Do not write `container:`.
#   The image has no .NET SDK, so install it with dotnet-install.sh and cache ~/.dotnet.
# ⚠ `uses:` only actions present in forge's mirror (actions/checkout@v4, actions/cache@v4).
# ⚠ Do not add GitHub CI (GitHub is a mirror of forge).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# When the same PR (branch) is pushed again, cancel the older run and check only the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Core)
    runs-on: nolumialab
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached .NET SDK
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-sdk-${{ hashFiles('global.json') }}

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install .NET SDK
        run: |
          if [ ! -x "$HOME/.dotnet/dotnet" ]; then
            curl -sSfL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
            bash "$RUNNER_TEMP/dotnet-install.sh" --jsonfile global.json --install-dir "$HOME/.dotnet"
          fi
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      # The slnx also contains the Windows shell, so build the five net10.0 projects by name.
      - name: Build
        run: |
          for p in Domain Application Infrastructure Cli CoreTests; do
            dotnet build "NolumiaScheduler.$p/NolumiaScheduler.$p.csproj" -c Release
          done

      - name: Test
        run: dotnet test NolumiaScheduler.CoreTests/NolumiaScheduler.CoreTests.csproj -c Release --no-build
